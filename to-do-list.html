<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My To-Do List</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #0f172a, #1e2937);
    }
    .task-item {
      transition: all 0.3s ease;
    }
    .task-item:hover {
      transform: translateX(8px);
      box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
    }
    .completed {
      text-decoration: line-through;
      opacity: 0.7;
    }
  </style>
</head>
<body class="min-h-screen text-white">
  <div class="max-w-2xl mx-auto pt-12 px-4">
    <!-- Header -->
    <div class="flex items-center justify-between mb-8">
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-list-check text-4xl text-blue-400"></i>
        <h1 class="text-4xl font-bold tracking-tight">Todo</h1>
      </div>
      <div class="text-sm text-slate-400" id="taskCount">0 tasks</div>
    </div>

    <!-- Add Task -->
    <div class="bg-slate-800/50 backdrop-blur-lg border border-slate-700 rounded-2xl p-2 mb-8">
      <div class="flex gap-3">
        <input 
          type="text" 
          id="taskInput"
          placeholder="What needs to be done?"
          class="flex-1 bg-transparent border-0 focus:outline-none text-lg px-4 py-4 placeholder-slate-500"
          autocomplete="off"
        >
        <button 
          id="addBtn"
          class="bg-blue-600 hover:bg-blue-500 px-8 rounded-xl font-medium transition-colors">
          Add
        </button>
      </div>
    </div>

    <!-- Filters -->
    <div class="flex gap-2 mb-6 border-b border-slate-700 pb-4">
      <button onclick="filterTasks('all')" class="filter-btn active px-5 py-2 rounded-xl text-sm font-medium" data-filter="all">All</button>
      <button onclick="filterTasks('active')" class="filter-btn px-5 py-2 rounded-xl text-sm font-medium" data-filter="active">Active</button>
      <button onclick="filterTasks('completed')" class="filter-btn px-5 py-2 rounded-xl text-sm font-medium" data-filter="completed">Completed</button>
    </div>

    <!-- Task List -->
    <div id="taskList" class="space-y-3 mb-8"></div>

    <!-- Footer -->
    <div class="flex justify-between items-center text-sm text-slate-400">
      <button onclick="clearCompleted()" 
              class="hover:text-red-400 transition-colors flex items-center gap-2">
        <i class="fa-solid fa-trash"></i>
        Clear Completed
      </button>
      <div class="text-xs text-slate-500">Press <span class="font-mono bg-slate-800 px-1.5 py-0.5 rounded">Enter</span> to add</div>
    </div>
  </div>

  <script>
    let tasks = [];
    let currentFilter = 'all';

    const taskInput = document.getElementById('taskInput');
    const addBtn = document.getElementById('addBtn');
    const taskList = document.getElementById('taskList');
    const taskCount = document.getElementById('taskCount');

    function loadTasks() {
      const saved = localStorage.getItem('todos');
      if (saved) {
        tasks = JSON.parse(saved);
      }
      renderTasks();
    }

    function saveTasks() {
      localStorage.setItem('todos', JSON.stringify(tasks));
    }

    function addTask() {
      const text = taskInput.value.trim();
      if (!text) return;

      tasks.unshift({
        id: Date.now(),
        text: text,
        completed: false,
        createdAt: new Date()
      });

      taskInput.value = '';
      saveTasks();
      renderTasks();
    }

    function toggleComplete(id) {
      tasks = tasks.map(task => 
        task.id === id ? {...task, completed: !task.completed} : task
      );
      saveTasks();
      renderTasks();
    }

    function deleteTask(id) {
      tasks = tasks.filter(task => task.id !== id);
      saveTasks();
      renderTasks();
    }

    function clearCompleted() {
      tasks = tasks.filter(task => !task.completed);
      saveTasks();
      renderTasks();
    }

    function filterTasks(filter) {
      currentFilter = filter;
      
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === filter);
      });
      
      renderTasks();
    }

    function updateCount() {
      const active = tasks.filter(t => !t.completed).length;
      taskCount.textContent = `${active} active`;
    }

    function renderTasks() {
      taskList.innerHTML = '';

      let filteredTasks = tasks;
      
      if (currentFilter === 'active') {
        filteredTasks = tasks.filter(t => !t.completed);
      } else if (currentFilter === 'completed') {
        filteredTasks = tasks.filter(t => t.completed);
      }

      if (filteredTasks.length === 0) {
        taskList.innerHTML = `
          <div class="text-center py-16 text-slate-500">
            <i class="fa-solid fa-clipboard-list text-6xl mb-4 opacity-30"></i>
            <p class="text-lg">No tasks found</p>
          </div>`;
        updateCount();
        return;
      }

      filteredTasks.forEach(task => {
        const div = document.createElement('div');
        div.className = `task-item bg-slate-800/70 backdrop-blur border border-slate-700 rounded-2xl p-5 flex items-center gap-4 group`;
        
        div.innerHTML = `
          <input type="checkbox" 
                 class="w-6 h-6 accent-blue-500 cursor-pointer"
                 ${task.completed ? 'checked' : ''}>
          <div class="flex-1">
            <p class="text-lg ${task.completed ? 'completed' : ''}">${task.text}</p>
          </div>
          <button onclick="deleteTask(${task.id})" 
                  class="opacity-0 group-hover:opacity-100 text-red-400 hover:text-red-500 transition-all">
            <i class="fa-solid fa-trash"></i>
          </button>
        `;

        const checkbox = div.querySelector('input');
        checkbox.addEventListener('change', () => toggleComplete(task.id));

        taskList.appendChild(div);
      });

      updateCount();
    }

    // Event Listeners
    addBtn.addEventListener('click', addTask);

    taskInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') addTask();
    });

    // Initialize
    loadTasks();
  </script>
</body>
</html>
